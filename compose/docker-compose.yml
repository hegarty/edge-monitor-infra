services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/prometheus.token:/etc/prometheus/prometheus.token:ro
      - ./prometheus/prometheus-ca.crt:/etc/prometheus/prometheus-ca.crt:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - edge-net
      - k3d
    extra_hosts:
      - "k3d-edge-dev-server-0:172.19.0.4"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      # Mount entire provisioning directory (contains dashboards/ and datasources/)
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Mount dashboard JSON files
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge

  k3d:
    external: true
    name: k3d-edge-dev

volumes:
  grafana-storage:
